name: Build debug APK

on:
  push:
    paths: ['apk/**','.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pure-Java core: compile with --release 8 and run the harness against the bundled real captures.
      - name: Core tests (javac, no Android)
        run: core/run_tests.sh

      - name: Install SDK platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      # setup-gradle provides Gradle 8.7 itself, so this works even if gradlew / gradle-wrapper.jar were not uploaded.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
